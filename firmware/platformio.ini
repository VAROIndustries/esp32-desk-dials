[platformio]
default_envs = fairkeep-dial

; VARO Desk Dial — Waveshare ESP32-S3-Touch-AMOLED-1.75
; Build:  pio run            Flash: pio run -t upload
; Release image for the browser installer: python tools/make_release.py
;
; Platform, flash/PSRAM layout and library versions match Capsule Radar's known-good set
; for this exact panel (github.com/socquique/capsule-radar, MIT).

[env:fairkeep-dial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<gate_main.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git
    lewisxhe/XPowersLib

; Drawing gate image (spec 5): pio run -e sky-gate; upload its firmware.bin on the dial's settings page.
[env:sky-gate]
extends = env:fairkeep-dial
build_src_filter = +<*> -<main.cpp>
build_flags = ${env:fairkeep-dial.build_flags} -DLV_USE_PERF_MONITOR=1

; Host-side unit tests for the plain C++ parts (pio test -e native).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<sky_model.cpp>
test_build_src = yes
build_flags = -std=gnu++17 -I src
lib_deps = bblanchon/ArduinoJson @ ^7.0.4
